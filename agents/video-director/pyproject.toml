[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "video-director-agent"
version = "0.1.0"
description = "Artifact-first video production kernel"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = []

[project.scripts]
video-director = "video_director.cli:main"

[tool.setuptools.packages.find]
include = ["video_director*"]
